stages:
  - test

Build:
  stage: test
  image: registry.hpc.ut.ee/mirror/library/rust:1.89-bookworm
  cache:
    key: cargo
    paths:
      - .cargo/registry
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  before_script:
    # The rust:bookworm image doesn't ship clippy by default.
    - rustup component add clippy
  script:
    - cargo build --locked
    - cargo clippy --all-targets
