[package]
name = "waldur-cli"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "Scriptable CLI for Waldur MasterMind: OpenStack resource management and team management"
repository = "https://github.com/waldur/waldur-cli"
readme = "README.md"

[[bin]]
name = "waldur-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
directories = "5"
jmespath = "0.5"
# default-features off: this crate's defaults pull in reqwest/hyper/rustls to
# resolve remote $refs over HTTP -- unneeded here, since every request-body
# schema is fully dereferenced/self-contained at generation time.
jsonschema = { version = "0.48", default-features = false }
open = "5.4.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `query` is a feature in 0.5 (it wasn't in 0.4) and enables reqwest's own --
# pagination.rs builds each page request with `.query(&params)`.
reqwest-middleware = { version = "0.5", features = ["query"] }
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon_format = "0.1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
self_update = { version = "0.44.0", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2", "reqwest"] }

# The profile that 'dist' will build with. Optimized for a small
# distributed binary over build time or raw speed -- this CLI is I/O-bound
# (network calls), so opt-level="z" and panic="abort" cost effectively
# nothing at runtime in exchange for a meaningfully smaller download.
[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
